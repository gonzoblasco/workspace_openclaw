# .kanam/enforcer.config.yaml
#
# Binding del Design System Enforcer para el repo workspace_openclaw.
# El enforcer es agnóstico: acá se declara QUÉ design system valida y qué
# excepciones tiene ESTE repo (whitelist de hex legítimos).
#
# Lo consumen:
#   - el pre-commit (scripts/design-precommit.sh, vía husky)
#   - el stage 1 del surface-pipeline en CI (.kanam/pipeline.config.yaml)

project:
  name: "kanam-auditor"
  # Carpeta que contiene tokens.md (la fuente de verdad del Design System).
  # Relativa a la raíz del repo; el adapter la resuelve con path.resolve().
  design_system_path: "design"

rules:
  enforceTokens: true
  blockHardcoded: true
  aiLookVeto: true

# Hex que este repo usa legítimamente fuera de tokens y que NO deben advertirse.
# Vacío a propósito: la política es "si no es token, se sugiere token". Si un
# valor legítimo empieza a dar ruido, se agrega acá y se documenta por qué.
whitelist:
  hex: []

# Paths que el walker NO escanea (globs, relativos a la raíz del repo).
# Por qué existen: el propio motor del enforcer contiene las cadenas que busca
# (la tabla de morados prohibidos en src/color.js, el detector de
# `linear-gradient(` en src/enforcer.js) y los tests contienen fixtures que
# disparan a propósito. Sin este corte, escanear el árbol de skills reporta
# las definiciones de reglas como violaciones: 5 bloqueos medidos el
# 2026-11-06, los 5 falsos positivos. Un linter sin ignore es un linter que
# se auto-rechaza.
exclude:
  - "agents/kanam-auditor/skills/**/tests/**"
  - "agents/kanam-auditor/skills/design-system-enforcer/src/enforcer.js"
  - "agents/kanam-auditor/skills/design-system-enforcer/src/color.js"
  # Tabla de colores nombrados del parser (blue: '#0000ff'): es una utilidad
  # de parseo, no una decisión de superficie.
  - "agents/kanam-auditor/skills/pixel-diff/src/utils/color.js"
