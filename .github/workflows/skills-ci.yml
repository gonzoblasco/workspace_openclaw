name: Skill Scripts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install pytest certifi

      - name: Syntax checks (bash + python)
        run: ./scripts/test-skills.sh

      - name: Bash functional tests
        run: npx bats tests/bash/

      - name: Python functional tests
        run: pytest tests/python/

      # Segunda barrera del boundary de a11y-at-validation. El pre-commit se
      # puede saltear con --no-verify; esto lo cubre en la superficie publica.
      # En un PR el rango es contra la base; en un push a main, el ultimo commit.
      - name: Accessibility trigger gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          python3 scripts/check-a11y-trigger.py --range "$RANGE"
