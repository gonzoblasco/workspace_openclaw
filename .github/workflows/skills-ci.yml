name: Skill Scripts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: el gate de abajo compara contra un rango de
          # commits, y el checkout por defecto (fetch-depth: 1) deja el runner
          # con un solo commit, asi que HEAD~1 no resuelve. Verificado
          # 2026-09-28: con el default, TODOS los push a main fallaban con
          # "ambiguous argument 'HEAD~1..HEAD'".
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install pytest certifi

      - name: Syntax checks (bash + python)
        # --all: en CI no hay staging, asi que el scope por defecto (solo
        # archivos staged) veria 0 archivos. Sin --all el script aborta; el
        # barrido completo del arbol de skills es lo que cubre esta superficie.
        run: ./scripts/test-skills.sh --all

      # Budget de bootstrap (ROADMAP 0.1): los archivos inyectados en cada
      # arranque se truncan en silencio al superar su cap. Segunda barrera (el
      # pre-commit se puede saltear con --no-verify).
      - name: Bootstrap budget gate
        run: python3 scripts/check-bootstrap-budget.py

      # ------------------------------------------------------------
      # Roadmap version validation
      # ------------------------------------------------------------
      # El guard `check-roadmaps.py` asegura que cada ROADMAP.md exista, tenga la
      # cabecera correcta y que la versión declarada coincida con la tabla de
      # seguimiento (`docs/roadmap-tracking.json`). En CI no hay pre‑commit, así
      # que este paso garantiza que cualquier push que rompa la coherencia falle.
      - name: Roadmap version check
        run: python3 scripts/check-roadmaps.py

      - name: Bash functional tests
        run: npx bats tests/bash/

      - name: Python functional tests
        run: pytest tests/python/

      # Design system (ADR-095): regenerar el CSS de tokens y verificar contraste
      # WCAG. El dist/ esta gitignored (generado), asi que CI lo construye.
      - name: Design tokens (build + contrast gate)
        run: |
          python3 design/tokens/build-tokens.py
          python3 scripts/check-design-tokens.py --check

      # Node functional tests (2026-10-06). Antes tests/node/ existia y NO corria
      # en ningun lado: solo bats y pytest estaban cableados. Incluye el
      # clasificador del gate de a11y (scripts/a11y-scan.mjs); el escaneo con
      # browser real es local (CI no tiene playwright/chromium).
      - name: Node functional tests
        run: ./tests/node/run.sh

      # Segunda barrera del boundary de a11y-at-validation. El pre-commit se
      # puede saltear con --no-verify; esto lo cubre en la superficie publica.
      # El rango se calcula por evento, y en push cubre TODOS los commits del
      # push (no solo el ultimo): con HEAD~1..HEAD un push de 5 commits dejaba
      # 4 sin evaluar. Verificado 2026-09-28.
      - name: Accessibility trigger gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # base_ref puede faltar; sin el no hay base contra la cual comparar.
            if [ -z "$BASE_REF" ]; then
              echo "sin base_ref en el evento pull_request: no hay rango que evaluar"
            else
              git fetch --no-tags origin "$BASE_REF"
              RANGE="origin/$BASE_REF..HEAD"
            fi
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO" ] && git rev-parse --verify --quiet "$BEFORE_SHA" >/dev/null; then
            # Rango completo del push. En el primer push a una rama, before es
            # la SHA cero y no sirve como base. Se verifica que exista ademas de
            # no ser cero: en un force-push la base anterior puede ya no estar en
            # el clon, y usarla daria un fallo del gate sin codigo que evaluar.
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          elif git rev-parse --verify --quiet "${HEAD_SHA}~1" >/dev/null; then
            RANGE="${HEAD_SHA}~1..$HEAD_SHA"
          else
            echo "sin base de comparacion (commit inicial de la rama): gate sin rango a evaluar"
          fi

          if [ -z "$RANGE" ]; then
            # Un skip nombrado, nunca un verde silencioso: si aca se callara, la
            # barrera seria indistinguible de una ausente.
            echo "GATE NO EVALUADO: no se pudo determinar un rango de comparacion."
            exit 0
          fi
          python3 scripts/check-a11y-trigger.py --range "$RANGE"
