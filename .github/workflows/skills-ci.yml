name: Skill Scripts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: el gate de abajo compara contra un rango de
          # commits, y el checkout por defecto (fetch-depth: 1) deja el runner
          # con un solo commit, asi que HEAD~1 no resuelve. Verificado
          # 2026-09-28: con el default, TODOS los push a main fallaban con
          # "ambiguous argument 'HEAD~1..HEAD'".
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install pytest certifi

      - name: Syntax checks (bash + python)
        # --all: en CI no hay staging, asi que el scope por defecto (solo
        # archivos staged) veria 0 archivos. Sin --all el script aborta; el
        # barrido completo del arbol de skills es lo que cubre esta superficie.
        run: ./scripts/test-skills.sh --all

      # Budget de bootstrap (ROADMAP 0.1): los archivos inyectados en cada
      # arranque se truncan en silencio al superar su cap. Segunda barrera (el
      # pre-commit se puede saltear con --no-verify).
      - name: Bootstrap budget gate
        run: python3 scripts/check-bootstrap-budget.py

      # Fuente unica (ADR-100): un dato, un dueno. Una regla repetida en dos
      # archivos normativos, o un tag de modelo escrito a mano fuera de su
      # bloque managed, se detecta aca. Sin este paso la unica barrera seria el
      # pre-commit, que se saltea con --no-verify.
      - name: Single source gate
        run: python3 scripts/check-single-source.py

      # Hechos de carrera (ADR-101): los CVs citan un dueno unico. Caza anos,
      # idioma, fechas, contacto y certificaciones que no coinciden, y FRENA si
      # hay una decision pendiente sin resolver.
      - name: CV facts gate
        run: python3 scripts/check-cv-facts.py

      # ------------------------------------------------------------
      # Roadmap version validation
      # ------------------------------------------------------------
      # El guard `check-roadmaps.py` asegura que cada ROADMAP.md exista, tenga la
      # cabecera correcta y que la versión declarada coincida con la tabla de
      # seguimiento (`docs/roadmap-tracking.json`). En CI no hay pre‑commit, así
      # que este paso garantiza que cualquier push que rompa la coherencia falle.
      - name: Roadmap version check
        run: python3 scripts/check-roadmaps.py

      - name: Bash functional tests
        run: npx bats tests/bash/

      - name: Python functional tests
        run: pytest tests/python/

      # Kit del Critic (T4.1, eje H). El Critic se audita con hechos, no con
      # prosa: si el agente (el kit como entregable) se rompe, este paso lo
      # dice. Los cuatro comandos corren desde la raiz del repo, que es el cwd
      # del runner; los scripts resuelven sus rutas desde __file__.
      - name: Critic kit tests
        run: |
          set -euo pipefail

          # pytest.ini de la raiz ya aporta -q: pasar otro -q lo vuelve -qq y
          # se pierde el resumen. El sandbox del lab evidence-hunter lo genera
          # scaffold.py y repite el basename test_foo.py en varios casos, lo
          # que aborta la coleccion por import mismatch. No es codigo
          # versionado: se ignora esa ruta.
          python3 -m pytest agents/kanam-critic/tests/ \
            --ignore=agents/kanam-critic/tests/evidence-hunter/sandbox

          # Gate de evidencia sobre el spec del objective-extractor: cualquier
          # caso que no de el exit esperado termina en exit != 0.
          python3 agents/kanam-critic/bin/gate-evidence.py --spec agents/kanam-critic/tests/gate-evidence/spec-objective-extractor.json

          # Guard del veredicto: exit 1 si algun veredicto real no tiene fila en
          # el ledger Y reporte publicado con citas (verificado 2026-11-19:
          # exit 0 <-> GLOBAL=aprobado, exit 1 <-> GLOBAL=veto).
          python3 agents/kanam-critic/bin/verify-verdict.py

          # check-kit mezcla checks del repo con UNO que depende de la maquina:
          # "disparador: heartbeat por agente" lee ~/.openclaw/openclaw.json, que
          # no existe en el runner (verificado 2026-11-19 con HOME vacio:
          # GLOBAL=veto 17/18, exit 1). Corrido tal cual, este paso seria rojo
          # siempre. Se exige verde salvo ese check, nombrado explicitamente
          # para que no tape un rojo real: si aparece un segundo rojo, falla.
          kit_out="$(python3 agents/kanam-critic/bin/check-kit.py || true)"
          printf '%s\n' "$kit_out"
          if grep -q '^GLOBAL=aprobado' <<<"$kit_out"; then
            exit 0
          fi
          reds="$(grep -c '^\[ROJO\]' <<<"$kit_out" || true)"
          if [ "$reds" -eq 1 ] && grep -q '^\[ROJO\] disparador: heartbeat por agente' <<<"$kit_out"; then
            echo "critic-kit: verde salvo el check de disparador (config de maquina, no aplica en CI)."
            exit 0
          fi
          echo "critic-kit: hay checks rojos fuera del unico dependiente de la maquina." >&2
          exit 1

      # Gate del veredicto (T5.2): el veredicto no se cierra hasta que existe su fila,
      # su reporte con >=5 citas `ruta:linea` con archivo real y un verdict vigente.
      # `--all` barre los artifacts del ledger; falla (exit 4) si alguno carece de
      # respaldo. Un VETO vigente se informa y se cuenta, no rompe el repo: el criterio
      # del programa es "sin veredicto falla, con veredicto pasa". El gate duro por
      # artifact (`check-critic-gate.py <slug>`, exit 3 en VETO) es lo que consume quien
      # necesita aprobacion explicita. Sin este paso, verify-verdict.py solo corre dentro
      # del step del kit y un reporte borrado no lo ve nadie.
      - name: Critic verdict gate
        run: python3 scripts/check-critic-gate.py --all

      # Design system (ADR-095): regenerar el CSS de tokens y verificar contraste
      # WCAG. El dist/ esta gitignored (generado), asi que CI lo construye.
      - name: Design tokens (build + contrast gate)
        run: |
          python3 design/tokens/build-tokens.py
          python3 scripts/check-design-tokens.py --check

      # Node functional tests (2026-10-06). Antes tests/node/ existia y NO corria
      # en ningun lado: solo bats y pytest estaban cableados. Incluye el
      # clasificador del gate de a11y (scripts/a11y-scan.mjs); el escaneo con
      # browser real es local (CI no tiene playwright/chromium).
      - name: Node functional tests
        run: ./tests/node/run.sh

      # Segunda barrera del boundary de a11y-at-validation. El pre-commit se
      # puede saltear con --no-verify; esto lo cubre en la superficie publica.
      # El rango se calcula por evento, y en push cubre TODOS los commits del
      # push (no solo el ultimo): con HEAD~1..HEAD un push de 5 commits dejaba
      # 4 sin evaluar. Verificado 2026-09-28.
      - name: Accessibility trigger gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # base_ref puede faltar; sin el no hay base contra la cual comparar.
            if [ -z "$BASE_REF" ]; then
              echo "sin base_ref en el evento pull_request: no hay rango que evaluar"
            else
              git fetch --no-tags origin "$BASE_REF"
              RANGE="origin/$BASE_REF..HEAD"
            fi
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO" ] && git rev-parse --verify --quiet "$BEFORE_SHA" >/dev/null; then
            # Rango completo del push. En el primer push a una rama, before es
            # la SHA cero y no sirve como base. Se verifica que exista ademas de
            # no ser cero: en un force-push la base anterior puede ya no estar en
            # el clon, y usarla daria un fallo del gate sin codigo que evaluar.
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          elif git rev-parse --verify --quiet "${HEAD_SHA}~1" >/dev/null; then
            RANGE="${HEAD_SHA}~1..$HEAD_SHA"
          else
            echo "sin base de comparacion (commit inicial de la rama): gate sin rango a evaluar"
          fi

          if [ -z "$RANGE" ]; then
            # Un skip nombrado, nunca un verde silencioso: si aca se callara, la
            # barrera seria indistinguible de una ausente.
            echo "GATE NO EVALUADO: no se pudo determinar un rango de comparacion."
            exit 0
          fi
          python3 scripts/check-a11y-trigger.py --range "$RANGE"
