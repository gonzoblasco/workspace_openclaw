<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Hero B - editorial (D2)</title>
<style>
  :root{--bg:#f7f4ee;--fg:#1c1a16;--muted:#5b5043;--rule:rgba(28,26,22,.12);}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Iowan Old Style",Georgia,serif;}
  .hero{min-height:100vh;display:grid;place-items:center;padding:2rem clamp(1rem,4vw,4rem);}
  .container{max-width:64ch;}
  .meta{font-family:system-ui,sans-serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 2rem;}
  h1{font-family:ui-serif,Georgia,serif;font-size:clamp(2.5rem,1.75rem+4vw,5.5rem);line-height:1.05;letter-spacing:-.015em;font-weight:400;margin:0 0 .75rem;}
  h1 em{font-style:italic;}
  p{font-size:1.1875rem;line-height:1.55;color:var(--muted);max-width:52ch;margin:0 0 2rem;font-family:Georgia,serif;}
  .cta{font-family:system-ui,sans-serif;font-size:.9375rem;padding:.75rem 1.25rem;border:1px solid var(--fg);background:transparent;color:var(--fg);text-decoration:none;letter-spacing:.04em;}
  .rule{border-top:1px solid var(--rule);margin-top:2rem;}
</style></head><body>
  <section class="hero"><div class="container">
    <p class="meta">Field Notes · Issue 04</p>
    <h1>Words <em>held</em> to the line.</h1>
    <p>An editorial hero. Two channels: serif italic + rule weight.</p>
    <a class="cta" href="#">Read the essay</a>
    <div class="rule"></div>
  </div></section>
</body></html>
