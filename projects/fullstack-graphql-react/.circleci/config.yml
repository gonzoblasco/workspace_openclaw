version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@9.0
  aws-ecs: circleci/aws-ecs@4.0

jobs:
  test:
    docker:
      - image: cimg/node:22.0
        environment:
          JWT_SECRET: circleci-test-secret
      - image: cimg/mysql:8.0
        environment:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: graphbook_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: password
    steps:
      - checkout
      - run: npm ci
      - run:
          name: Wait for MySQL
          command: |
            for i in $(seq 1 10); do
              nc -z 127.0.0.1 3306 && echo "MySQL ready" && exit 0
              echo -n .
              sleep 1
            done
            echo "MySQL not ready" && exit 1
      - run:
          name: Run migrations
          command: npx drizzle-kit push
      - run:
          name: Run tests
          command: npm test
          environment:
            NODE_ENV: production

  build-and-push:
    docker:
      - image: cimg/node:22.0
    steps:
      - checkout
      - setup_remote_docker
      - aws-ecr/build-and-push-image:
          repo: graphbook
          tag: "${CIRCLE_SHA1}"

  deploy:
    docker:
      - image: cimg/node:22.0
    steps:
      - aws-ecs/deploy-service-update:
          family: "graphbook-task"
          cluster-name: "graphbook-cluster"
          service-name: "graphbook-service"
          container-image-name-updates: "container=graphbook,tag=${CIRCLE_SHA1}"

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
      - deploy:
          requires:
            - build-and-push
