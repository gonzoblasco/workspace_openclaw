name: CI Pipeline

on:
   push:
     branches: [main, develop]
   pull_request:
     branches: [main, develop]

jobs:
   test:
    name: Test + Lint
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
            node-version: '20'
            cache: 'npm'

         - name: Install dependencies
           run: npm ci

         - name: Run linter
           run: npm run lint

         - name: Run tests (unit)
           run: npm test -- --run

         - name: Security audit
           run: npm audit

   build:
    name: Build for Production
      if: github.event_name != 'pull_request'
      needs: [test]
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
            node-version: '20'
            cache: 'npm'

         - name: Install dependencies
          run: npm ci

         - name: Build project
          run: npm run build

         - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
           path: 'dist/'
           retention-days: 30
