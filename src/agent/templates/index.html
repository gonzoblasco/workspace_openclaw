<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Agente Local</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <h1>Documentos</h1>
    <ul>
        {% for doc in documents %}
        <li>{{ doc }}</li>
        {% endfor %}
    </ul>
    <h2>Chat</h2>
    <div id="chat-log"></div>
    <form hx-post="/ask" hx-target="#chat-log" hx-swap="afterbegin">
        <input name="query" placeholder="Haz una pregunta" />
        <button type="submit">Enviar</button>
    </form>
    <div id="health"></div>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</body>
</html>
