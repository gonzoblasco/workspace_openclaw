<!doctype html>
<html><head><meta charset="utf-8">
<style>
  .vh { border:0; clip:rect(0 0 0 0); clip-path:inset(50%); height:1px; margin:-1px;
        overflow:hidden; padding:0; position:absolute; width:1px; white-space:nowrap; }
  .host { position:relative; width:200px; height:40px; background:#ddd; margin:20px; }
  .consumerName { anchor-name: --consumer; }
  .overrideVar { --position-anchor-override: --consumer; }
</style></head>
<body><div id="results"></div>

<!-- V1: default via var fallback, no consumer override -->
<div class="host" id="hV1" data-anchor="--default-v1"><span class="vh"><input id="iV1"></span>label</div>
<!-- V2: consumer overrides via custom property -->
<div class="host overrideVar" id="hV2" data-anchor="--default-v2"><span class="vh"><input id="iV2"></span>label</div>
<!-- V3: consumer sets anchor-name via classname (does the var fallback pick it up? expect NO) -->
<div class="host consumerName" id="hV3" data-anchor="--default-v3"><span class="vh"><input id="iV3"></span>label</div>
<!-- V4: consumer sets both anchor-name (class) and the override var -->
<div class="host consumerName overrideVar" id="hV4" data-anchor="--default-v4"><span class="vh"><input id="iV4"></span>label</div>

<script>
let out=[];
function g(id){let r=document.getElementById(id).getBoundingClientRect();
  return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2)};}
function run(name,hostId,inputId,useInsetShorthand,position){
  let host=document.getElementById(hostId),input=document.getElementById(inputId);
  let def=host.dataset.anchor;
  // component sets default anchor-name inline at render (static, no layout effect)
  host.style.setProperty('anchor-name', def);
  let styles={position,margin:'0','position-anchor':'var(--position-anchor-override, '+def+')'};
  if(useInsetShorthand){ styles.inset='anchor(top) anchor(right) anchor(bottom) anchor(left)'; }
  else { styles.top='anchor(top)'; styles.left='anchor(left)';
         styles.width='anchor-size(width)'; styles.height='anchor-size(height)'; }
  Object.assign(input.style, styles);
  let hr=g(hostId),ir=g(inputId);
  out.push({case:name,
    host:hr,input:ir,
    computedPositionAnchor:getComputedStyle(input).getPropertyValue('position-anchor').trim(),
    computedAnchorName:getComputedStyle(host).getPropertyValue('anchor-name').trim(),
    computedInset:getComputedStyle(input).inset,
    covers:Math.abs(ir.x-hr.x)<=0.5&&Math.abs(ir.y-hr.y)<=0.5&&ir.w>=hr.w-0.5&&ir.h>=hr.h-0.5,
    exact:ir.w===hr.w&&ir.h===hr.h});
}
run('V1-var-fallback-default-fixed','hV1','iV1',false,'fixed');
run('V2-var-override-fixed','hV2','iV2',false,'fixed');
run('V3-classname-anchor-name-ignored-fixed','hV3','iV3',false,'fixed');
run('V4-classname-plus-var-override-fixed','hV4','iV4',false,'fixed');
run('V5-var-fallback-default-inset-shorthand','hV1','iV1',true,'fixed');
run('V6-var-override-inset-shorthand','hV2','iV2',true,'fixed');
run('V7-var-fallback-absolute','hV1','iV1',false,'absolute');

document.getElementById('results').textContent=JSON.stringify(out,null,2);
</script></body></html>
