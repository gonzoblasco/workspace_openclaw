<!doctype html>
<html><head><meta charset="utf-8">
<style>
  .vh { border:0; clip:rect(0 0 0 0); clip-path:inset(50%); height:1px; margin:-1px;
        overflow:hidden; padding:0; position:absolute; width:1px; white-space:nowrap; }
  .host { position:relative; width:200px; height:40px; background:#ddd; margin:20px; }
  .sib { position:relative; width:400px; height:120px; background:#efe; margin:20px; }
  .anc { display:inline-block; width:120px; height:30px; background:#fbb; }
</style></head>
<body><div id="results"></div>

<!-- matrix: target element type x position x anchor relationship -->
<div class="host" id="h1"><input id="t1"><span class="anc" id="a1" style="anchor-name:--a1"></span></div>
<div class="host" id="h2"><input id="t2"><span class="anc" id="a2" style="anchor-name:--a2"></span></div>
<div class="host" id="h3"><div id="t3"></div><span class="anc" id="a3" style="anchor-name:--a3"></span></div>
<div class="host" id="h4"><div id="t4"></div><span class="anc" id="a4" style="anchor-name:--a4"></span></div>

<script>
let out=[];
function g(id){let r=document.getElementById(id).getBoundingClientRect();
  return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2)};}
function run(name,targetId,anchorId,pos){
  let t=document.getElementById(targetId), a=document.getElementById(anchorId);
  let an=a.style.getPropertyValue('anchor-name');
  Object.assign(t.style,{position:pos,margin:'0',top:'anchor(top)',left:'anchor(left)',
    width:'anchor-size(width)',height:'anchor-size(height)','position-anchor':an});
  let tr=g(targetId), ar=g(anchorId);
  out.push({case:name,pos,
    anchor:ar,target:tr,
    computedWidth:getComputedStyle(t).width,
    matchesAnchorSize: Math.abs(tr.w-ar.w)<=1,
    matchesAnchorPos: Math.abs(tr.x-ar.x)<=1 && Math.abs(tr.y-ar.y)<=1});
}
run('input-absolute','t1','a1','absolute');
run('input-fixed','t2','a2','fixed');
run('div-absolute','t3','a3','absolute');
run('div-fixed','t4','a4','fixed');

const ins = getComputedStyle(document.getElementById('t2')).inset;
out.push({note:'fixed input inset', inset: ins,
  border: getComputedStyle(document.getElementById('t2')).borderTopWidth,
  padding: getComputedStyle(document.getElementById('t2')).paddingLeft,
  boxSizing: getComputedStyle(document.getElementById('t2')).boxSizing});
document.getElementById('results').textContent=JSON.stringify(out,null,2);
</script></body></html>
