[pytest]
# El `sandbox/` del lab NO es una suite: son fixtures con nombres de archivo
# repetidos a proposito (test_foo.py en varios casos) y con un test roto
# intencional (Caso 2). Recolectarlo desde la corrida general produce un
# error de coleccion por basename duplicado, no un veredicto del lab.
# `norecursedirs` solo afecta el RECURSADO: el hunter puede seguir invocando
# `pytest <archivo exacto>` sobre un caso del sandbox y ese archivo se corre.
norecursedirs = sandbox .venv .git __pycache__
