<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Page</title>
  <style>
    :root {
      --k-bg-main: #f8fafc;
      --k-bg-surface: #ffffff;
      --k-text-main: #0f172a;
      --k-text-muted: #64748b;
      --k-brand-primary: #0d9488;
      --k-border-subtle: #e2e8f0;
      --k-radius-md: 4px;
      --k-space-4: 16px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--k-bg-main);
      color: var(--k-text-main);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--k-bg-surface);
      padding: var(--k-space-4);
      border-radius: var(--k-radius-md);
      border: 1px solid var(--k-border-subtle);
    }

    h1 {
      font-size: 24px;
      margin-bottom: var(--k-space-4);
    }

    .form-group {
      margin-bottom: var(--k-space-4);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--k-border-subtle);
      border-radius: var(--k-radius-md);
      font-size: 16px;
      min-height: 24px; /* WCAG 2.2 target size */
    }

    input:focus {
      outline: 2px solid var(--k-brand-primary);
      outline-offset: 2px;
    }

    button {
      background: var(--k-brand-primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: var(--k-radius-md);
      font-size: 16px;
      cursor: pointer;
      min-height: 44px; /* WCAG 2.2 target size */
      min-width: 44px;
    }

    button:focus {
      outline: 2px solid var(--k-brand-primary);
      outline-offset: 2px;
    }

    button:hover {
      background: #0d9488;
    }

    .error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Formulario Accesible</h1>
    
    <form>
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required aria-describedby="name-error">
        <div id="name-error" class="error" role="alert" aria-live="polite"></div>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required aria-describedby="email-error">
        <div id="email-error" class="error" role="alert" aria-live="polite"></div>
      </div>

      <button type="submit">Enviar</button>
    </form>

    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="/">Inicio</a></li>
        <li><a href="/about">Acerca de</a></li>
      </ul>
    </nav>
  </div>

  <script>
    // Simple form validation
    document.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      
      if (!name.value) {
        document.getElementById('name-error').textContent = 'El nombre es requerido';
        name.setAttribute('aria-invalid', 'true');
      } else {
        document.getElementById('name-error').textContent = '';
        name.removeAttribute('aria-invalid');
      }
      
      if (!email.value || !email.value.includes('@')) {
        document.getElementById('email-error').textContent = 'Email inválido';
        email.setAttribute('aria-invalid', 'true');
      } else {
        document.getElementById('email-error').textContent = '';
        email.removeAttribute('aria-invalid');
      }
    });
  </script>
</body>
</html>
