<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>pixel-diff fixture</title>
  <style>
    :root {
      --k-space-4: 16px;
      --k-space-6: 32px;
      --k-radius-md: 12px;
      --k-radius-lg: 16px;
      --k-brand-primary: #0d9488;
      --k-bg-surface: #ffffff;
      --k-text-main: #111318;
      --k-font-size-xl: 22px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f5; font-family: Inter, sans-serif; }
    .card {
      width: 320px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 16px;
      background: var(--k-bg-surface);
      border: 1px solid #e2dfd6;
    }
    h1 { font-size: 22px; margin: 0 0 8px; color: var(--k-text-main); }
    p { font-size: 15px; color: var(--k-text-main); margin: 0 0 16px; }
    button {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background: var(--k-brand-primary);
      color: #fff;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <section class="wrap" style="padding: 24px 0;">
    <article class="card">
      <h1>Tarjeta Kanam</h1>
      <p>Superficie con tokens aplicados correctamente.</p>
      <button>Acción principal</button>
    </article>
  </section>
</body>
</html>
